name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build static Linked Data publication
        run: python scripts/build_web_publication.py

      - name: Check generated site
        run: |
          test -f docs/index.html
          test -f docs/resource/library/IT-RM0267/index.html
          test -f docs/resource/municipality/058091/index.html
          echo "Library pages: $(find docs/resource/library -name index.html | wc -l)"
          echo "Municipality pages: $(find docs/resource/municipality -name index.html | wc -l)"
          du -sh docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
